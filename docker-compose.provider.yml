name: einvoice-provider

networks:
  einvoice-network:
    driver: bridge
    name: einvoice-network

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - ./docker/docker-data/mongodb-data:/data/db
    restart: unless-stopped
    networks:
      - einvoice-network

  postgres:
    image: postgres:latest
    container_name: postgres_server
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: einvoice-app
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./docker/docker-data/postgresql-data:/var/lib/postgresql/data
    # restart: unless-stopped
    networks:
      - einvoice-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ui
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password123
    depends_on:
      - postgres
    volumes:
      - ./docker/docker-data/pgadmin-data:/var/lib/pgadmin
    networks:
      - einvoice-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak_25.0.0
    ports:
      - '8180:8080'
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    restart: unless-stopped
    command: start-dev
    networks:
      - einvoice-network
    volumes:
      - ./docker/docker-data/keycloak-data:/opt/keycloak/data

  redis:
    image: redis
    container_name: redis_server
    ports:
      - '6379:6379'
    networks:
      - einvoice-network
    restart: unless-stopped
    volumes:
      - ./docker/docker-data/redis-data:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight-ui
    ports:
      - '5540:5540'
    networks:
      - einvoice-network
    depends_on:
      - redis
    volumes:
      - ./docker/docker-data/redisinsight-data:/data

  kafka:
    container_name: kafka_server
    image: bitnamilegacy/kafka
    networks:
      - einvoice-network
    ports:
      - 9092:9092 # internal Docker network listener (optionally)
      - 29092:29092 # external listener, host local connect
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@localhost:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - ./docker/docker-data/kafka-data/bitnami_data:/bitnami/kafka
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - einvoice-network

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - einvoice-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - '3000:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/docker-data/grafana-data:/var/lib/grafana
    networks:
      - einvoice-network
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - einvoice-network
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.5.0
    container_name: tempo
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml
      - ./docker/docker-data/tempo-data:/var/tempo
    ports:
      - '3200:3200' # Tempo HTTP
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    networks:
      - einvoice-network
