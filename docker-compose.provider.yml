name: einvoice-provider

networks:
  einvoice-network:
    driver: bridge
    name: einvoice-network

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - ./docker/docker-data/mongodb-data:/data/db
    restart: unless-stopped
    networks:
      - einvoice-network

  postgres:
    image: postgres:latest
    container_name: postgres_server
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: einvoice-app
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./docker/docker-data/postgresql-data:/var/lib/postgresql/data
    # restart: unless-stopped
    networks:
      - einvoice-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_ui
    restart: unless-stopped
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password123
    depends_on:
      - postgres
    volumes:
      - ./docker/docker-data/pgadmin-data:/var/lib/pgadmin
    networks:
      - einvoice-network
